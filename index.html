<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biomed</title>
<style>
/* ==========================================================
   Biomed - Design system
   Palette rose personnelle + plum foncé
   ========================================================== */

@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

:root {
    --rose-deep:  #B3184F;
    --rose-mid:   #E0567F;
    --rose-soft:  #F7C6D9;
    --rose-pale:  #FFF5F8;
    --plum-dark:  #2E1A24;
    --plum-mid:   #452A38;
    --ink:        #3A2530;
    --ink-light:  #7A6270;
    --white:      #FFFFFF;
    --border:     #F0DDE5;

    --sage:   #6E8F72;
    --sage-bg:#EAF2EB;
    --amber:  #D99A45;
    --amber-bg:#FBF0DF;
    --red:    #B23A48;
    --red-bg: #FBE7E9;

    --radius: 12px;
    --shadow: 0 2px 10px rgba(46, 26, 36, 0.06);
    --shadow-lg: 0 8px 28px rgba(46, 26, 36, 0.12);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: 'Inter', sans-serif;
    background: var(--rose-pale);
    color: var(--ink);
    font-size: 14.5px;
    line-height: 1.55;
}

h1, h2, h3, h4, .display {
    font-family: 'Fraunces', serif;
    color: var(--plum-dark);
    font-weight: 600;
}

code, .mono, .data { font-family: 'JetBrains Mono', monospace; }

a { color: var(--rose-deep); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ---------------- Layout ---------------- */
.app { display: flex; min-height: 100vh; }

.sidebar {
    width: 240px;
    background: var(--plum-dark);
    color: #F3E3EA;
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
}

.sidebar .brand {
    font-family: 'Fraunces', serif;
    font-size: 20px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 6px;
}
.sidebar .brand-sub {
    font-size: 11px;
    color: var(--rose-soft);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 28px;
}

.sidebar nav { flex: 1; display: flex; flex-direction: column; gap: 2px; }

.sidebar nav a {
    color: #E7CBD6;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 10px;
}
.sidebar nav a:hover { background: rgba(255,255,255,0.06); text-decoration: none; }
.sidebar nav a.active { background: var(--rose-deep); color: #fff; }

.sidebar .user-box {
    border-top: 1px solid rgba(255,255,255,0.1);
    padding-top: 16px;
    margin-top: 16px;
    font-size: 12.5px;
}
.sidebar .user-box .name { color: #fff; font-weight: 600; }
.sidebar .user-box .role { color: var(--rose-soft); }
.sidebar .user-box a.logout { color: #E7CBD6; font-size: 12px; }

.main { flex: 1; min-width: 0; }

.topbar {
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 16px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}
.topbar h1 { font-size: 22px; }
.topbar .breadcrumb { font-size: 13px; color: var(--ink-light); }

.content { padding: 28px; }

/* ---------------- Cards / stats ---------------- */
.grid { display: grid; gap: 18px; }
.grid-4 { grid-template-columns: repeat(4, 1fr); }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-2 { grid-template-columns: repeat(2, 1fr); }
@media (max-width: 1100px) { .grid-4, .grid-3 { grid-template-columns: repeat(2,1fr); } }

.card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow);
}

.stat-card .label { font-size: 12.5px; color: var(--ink-light); text-transform: uppercase; letter-spacing: 0.04em; }
.stat-card .value { font-family: 'Fraunces', serif; font-size: 32px; font-weight: 700; color: var(--plum-dark); margin-top: 4px; }
.stat-card .sub { font-size: 12.5px; color: var(--ink-light); margin-top: 4px; }

/* ---------------- Tables ---------------- */
table { width: 100%; border-collapse: collapse; background: #fff; }
thead th {
    text-align: left;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ink-light);
    border-bottom: 2px solid var(--border);
    padding: 10px 14px;
}
tbody td { padding: 12px 14px; border-bottom: 1px solid var(--border); font-size: 13.5px; }
tbody tr:hover { background: var(--rose-pale); }

.table-wrap { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }

/* ---------------- Badges ---------------- */
.badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 600; }
.badge-service  { background: var(--sage-bg); color: var(--sage); }
.badge-panne    { background: var(--red-bg); color: var(--red); }
.badge-maint    { background: var(--amber-bg); color: var(--amber); }
.badge-hs       { background: #EDE3E7; color: var(--ink-light); }
.badge-rose     { background: var(--rose-soft); color: var(--rose-deep); }

.risk-low    { color: var(--sage); font-weight: 600; }
.risk-medium { color: var(--amber); font-weight: 600; }
.risk-high   { color: var(--red);  font-weight: 600; }

.risk-bar { height: 6px; border-radius: 4px; background: var(--border); overflow: hidden; width: 100px; }
.risk-bar span { display: block; height: 100%; background: var(--rose-deep); }

/* ---------------- Buttons ---------------- */
.btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 9px 16px; border-radius: 8px; font-size: 13.5px; font-weight: 600;
    border: 1px solid transparent; cursor: pointer;
}
.btn-primary { background: var(--rose-deep); color: #fff; }
.btn-primary:hover { background: #941140; text-decoration: none; }
.btn-outline { background: #fff; border-color: var(--border); color: var(--ink); }
.btn-outline:hover { border-color: var(--rose-deep); color: var(--rose-deep); text-decoration: none; }
.btn-sm { padding: 5px 10px; font-size: 12px; }
.btn-danger { background: var(--red); color: #fff; }

/* ---------------- Forms ---------------- */
label { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 5px; color: var(--ink); }
input, select, textarea {
    width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px;
    font-family: inherit; font-size: 13.5px; background: #fff; color: var(--ink);
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--rose-deep); }
.field { margin-bottom: 14px; }

/* ---------------- Checklist ---------------- */
.checklist-item {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 12px 14px; border-bottom: 1px solid var(--border);
}
.checklist-item:last-child { border-bottom: none; }
.checklist-item input[type=checkbox] { width: auto; margin-top: 3px; }
.checklist-item .tag-qualif {
    font-size: 10.5px; font-weight: 700; text-transform: uppercase;
    background: var(--rose-soft); color: var(--rose-deep); padding: 2px 7px; border-radius: 5px; margin-left: 8px;
}

/* ---------------- Login ---------------- */
.login-wrap { min-height: 100vh; display: flex; }
.login-hero {
    flex: 1.1; background: linear-gradient(160deg, var(--plum-dark), #4A1F35);
    color: #fff; padding: 60px; display: flex; flex-direction: column; justify-content: center;
}
.login-hero h1 { font-family: 'Fraunces', serif; font-size: 34px; color: #fff; margin-bottom: 16px; }
.login-hero p { color: var(--rose-soft); max-width: 380px; }
.login-hero ul { margin-top: 30px; list-style: none; display: flex; flex-direction: column; gap: 14px; }
.login-hero li { color: #F3E3EA; font-size: 14px; }

.login-form-side { flex: 1; display: flex; align-items: center; justify-content: center; background: #fff; }
.login-form { width: 320px; }
.login-form h2 { margin-bottom: 6px; }
.login-form .sub { color: var(--ink-light); font-size: 13px; margin-bottom: 24px; }

/* ---------------- Flash messages ---------------- */
.flash { padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; font-size: 13.5px; }
.flash-success { background: var(--sage-bg); color: var(--sage); }
.flash-error   { background: var(--red-bg); color: var(--red); }

/* ---------------- Misc ---------------- */
.muted { color: var(--ink-light); }
.section-title { font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-light); margin: 22px 0 10px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
.tabs a { padding: 10px 16px; font-size: 13.5px; font-weight: 600; color: var(--ink-light); border-bottom: 2px solid transparent; }
.tabs a.active { color: var(--rose-deep); border-color: var(--rose-deep); }


/* ---------------- Ajouts version statique ---------------- */
.hero-home { background: var(--plum-dark); color: #F3E3EA; border-radius: var(--radius); padding: 36px 32px; margin-bottom: 8px; }
.hero-home h1 { color: #fff; font-size: 44px; margin-bottom: 10px; }
.hero-home p { color: var(--rose-soft); max-width: 680px; margin-bottom: 8px; }
.hero-home .muted { color: #cdb3c0; }

.timeline { list-style: none; border-left: 2px solid var(--rose-soft); padding-left: 18px; display: flex; flex-direction: column; gap: 14px; }
.timeline li { position: relative; }
.timeline li::before { content: ''; position: absolute; left: -24px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--rose-deep); }
.timeline li b { display: block; color: var(--plum-dark); font-size: 13px; }

.log { background: var(--plum-dark); color: #F3E3EA; font-family: 'JetBrains Mono', monospace, monospace; font-size: 12px; line-height: 1.7; padding: 16px 18px; border-radius: var(--radius); max-height: 520px; overflow: auto; }

.sidebar .brand-link { color: #fff; text-decoration: none; }
.sidebar { position: sticky; top: 0; height: 100vh; overflow-y: auto; }

@media (max-width: 800px) {
    .app { flex-direction: column; }
    .sidebar { width: 100%; height: auto; position: static; padding: 14px 12px; }
    .sidebar .brand-sub { margin-bottom: 10px; }
    .sidebar nav { flex-direction: row; overflow-x: auto; gap: 6px; padding-bottom: 4px; }
    .sidebar nav a { white-space: nowrap; flex-shrink: 0; padding: 8px 12px; }
    .content { padding: 16px; }
    .topbar { padding: 14px 16px; flex-direction: column; align-items: flex-start; gap: 4px; }
    .grid-4, .grid-3, .grid-2 { grid-template-columns: 1fr; }
    .hero-home { padding: 24px 18px; }
    .hero-home h1 { font-size: 34px; }
    .tabs { overflow-x: auto; }
    .tabs a { white-space: nowrap; }
}

</style>
</head>
<body>

  <aside class="sidebar">

</div>

var COUT_HTML = "<div class=\"card\" style=\"border-left:4px solid var(--rose-deep);margin-bottom:20px;\">\n    <strong>Ce que couvre cette page, et ses limites.</strong> La professeure a demandé un chiffrage du projet\n    de capteurs qui capteraient réellement les valeurs du scanner et de l'IRM, en remplacement du générateur\n    simulé utilisé dans ce prototype. Je ne suis pas acheteuse en ingénierie biomédicale et je n'ai pas de devis\n    réel auprès d'un fournisseur médical. Les prix ci-dessous viennent de recherches ponctuelles (octobre 2026)\n    sur des sites de vente de composants d'instrumentation industrielle et de pièces d'imagerie grand public, pas\n    de catalogues internes de fabricants de scanners ou d'IRM, qui restent propriétaires et non publics. Je les\n    donne comme ordre de grandeur, à vérifier avant tout vrai projet auprès d'un fournisseur spécialisé en\n    instrumentation médicale ou directement auprès du fabricant de l'appareil.\n</div>\n\n<div class=\"section-title\" style=\"margin-top:0;\">Scanner-simulateur : composants, par paramètre surveillé</div>\n<div class=\"table-wrap\" style=\"margin-bottom:18px;\">\n    <table>\n        <thead><tr><th>Paramètre</th><th>Capteur / méthode</th><th>Exemple de prix trouvé</th><th>Fiabilité de ce chiffre</th></tr></thead>\n        <tbody>\n            <tr>\n                <td>Température du tube RX</td>\n                <td>Sonde RTD (PT100)</td>\n                <td class=\"mono\">≈ 111 € HT l'unité (≈ 135 € TTC)</td>\n                <td class=\"muted\" style=\"font-size:12.5px;\">Prix réel relevé sur un distributeur de composants industriels (RS Online, un seul modèle). Un capteur certifié pour l'intérieur d'un scanner médical coûterait probablement plus cher.</td>\n            </tr>\n            <tr>\n                <td>Rotation du portique</td>\n                <td>Codeur rotatif (encodeur)</td>\n                <td class=\"mono\">≈ 344 $ HT l'unité (modèle d'entrée de gamme)</td>\n                <td class=\"muted\" style=\"font-size:12.5px;\">Prix réel relevé, mais pour un encodeur mécanique basique (12 points), pas la précision qu'exigerait un gantry de scanner. À considérer comme une borne basse, pas une estimation fiable du bon capteur.</td>\n            </tr>\n            <tr>\n                <td>Position de la table</td>\n                <td>Codeur linéaire / règle optique</td>\n                <td class=\"mono\">Non trouvé</td>\n                <td class=\"muted\" style=\"font-size:12.5px;\">Je n'ai pas trouvé de prix public vérifiable pour ce type de composant en quelques recherches. Je préfère le dire plutôt que d'inventer un chiffre : à demander directement à un fournisseur (Heidenhain, RLS, Renishaw et équivalents sont les marques usuelles du secteur, à titre indicatif seulement).</td>\n            </tr>\n            <tr>\n                <td>Dérive HU / reproductibilité du plan</td>\n                <td>Fantôme eau + logiciel d'extraction automatique + analyse d'image (billes radio-opaques)</td>\n                <td class=\"mono\">Pas un capteur à l'unité : développement logiciel</td>\n                <td class=\"muted\" style=\"font-size:12.5px;\">Coût dominé par le temps de développement (voir ligne logicielle ci-dessous), pas par une pièce physique.</td>\n            </tr>\n            <tr>\n                <td>Acquisition &amp; transmission</td>\n                <td>Module d'acquisition de données (DAQ) + passerelle réseau</td>\n                <td class=\"mono\">De l'ordre de quelques centaines d'euros par voie</td>\n                <td class=\"muted\" style=\"font-size:12.5px;\">Je n'ai pas trouvé de prix actuel fiable : la seule référence trouvée est une annonce National Instruments de 2005 (« moins de 500 $ »), clairement obsolète. Chiffre à vérifier avant tout achat.</td>\n            </tr>\n        </tbody>\n    </table>\n</div>\n\n<div class=\"section-title\">IRM : composants, par paramètre surveillé</div>\n<div class=\"card\" style=\"margin-bottom:18px;\">\n    <p style=\"font-size:13px;\">\n        Différence notable avec le scanner : quatre des cinq paramètres surveillés sur l'IRM (distorsion\n        géométrique, épaisseur de coupe, uniformité, fantômage) s'obtiennent tous à partir d'une seule et même\n        acquisition d'un fantôme ACR, analysée par logiciel. Un seul investissement matériel (le fantôme) couvre\n        donc plusieurs paramètres à la fois, contrairement au scanner où chaque paramètre demandait un capteur\n        physique distinct.\n    </p>\n</div>\n<div class=\"table-wrap\" style=\"margin-bottom:18px;\">\n    <table>\n        <thead><tr><th>Paramètre</th><th>Capteur / méthode</th><th>Exemple de prix trouvé</th><th>Fiabilité de ce chiffre</th></tr></thead>\n        <tbody>\n            <tr>\n                <td>Niveau d'hélium de l'aimant</td>\n                <td>Sonde de niveau cryogénique (capacitive)</td>\n                <td class=\"mono\">Non trouvé (devis sur demande)</td>\n                <td class=\"muted\" style=\"font-size:12.5px;\">Les fabricants spécialisés dans l'instrumentation cryogénique (ex. American Magnetics) ne publient pas de prix en ligne pour ce type de sonde : il faut demander un devis. Je préfère le dire plutôt que d'inventer un chiffre.</td>\n            </tr>\n            <tr>\n                <td>Distorsion géométrique, épaisseur de coupe, uniformité, fantômage (les 4 ensemble)</td>\n                <td>Fantôme d'accréditation IRM de l'ACR + logiciel d'analyse d'image</td>\n                <td class=\"mono\">≈ 2 638 $ HT (modèle « large », un seul fantôme)</td>\n                <td class=\"muted\" style=\"font-size:12.5px;\">Prix réel relevé chez un revendeur de pièces d'imagerie médicale (PartsSource), pour le fantôme physique seul. Le logiciel d'analyse automatique des images (mesure des distances, de l'uniformité, du fantômage) reste un coût de développement à part, pas inclus dans ce prix.</td>\n            </tr>\n            <tr>\n                <td>Acquisition &amp; transmission</td>\n                <td>Passerelle réseau vers la base ino_biomed</td>\n                <td class=\"mono\">Même ordre de grandeur que pour le scanner</td>\n                <td class=\"muted\" style=\"font-size:12.5px;\">Même limite que pour le scanner : pas de prix actuel fiable trouvé, voir la ligne correspondante plus haut.</td>\n            </tr>\n        </tbody>\n    </table>\n</div>\n\n<div class=\"section-title\">Développement logiciel et intégration</div>\n<div class=\"card\" style=\"margin-bottom:18px;\">\n    <p>Remplacer <code class=\"mono\">genererLectureSimulee()</code> par de vraies lectures demanderait, pour\n    chaque équipement surveillé (scanner comme IRM), au minimum : un pilote ou une API pour lire chaque capteur\n    ou chaque analyse de fantôme, une passerelle qui pousse les valeurs vers la base <code class=\"mono\">ino_biomed</code>\n    (ce que fait déjà <code class=\"mono\">scripts/tick_monitoring.php</code>, juste avec de vraies données en\n    entrée au lieu de valeurs générées), et des tests de fiabilité avant mise en service clinique.</p>\n    <p class=\"muted\" style=\"font-size:12.5px;margin-top:10px;\">\n        Je n'ai pas de source chiffrée pour cette partie : c'est une estimation d'ingénierie personnelle, pas un\n        chiffre trouvé en ligne. À titre d'ordre de grandeur habituel pour ce type de projet (un prototype\n        fonctionnel, pas un dispositif médical certifié), je m'attendrais à plusieurs semaines de travail de\n        développement et d'intégration, sans compter les tests et la validation. À vérifier avec un vrai devis\n        avant de le citer comme chiffre ferme.\n    </p>\n</div>\n\n<div class=\"section-title\">Alternative réaliste : le contrat de télémétrie du fabricant</div>\n<div class=\"card\" style=\"margin-bottom:18px;\">\n    <p>Avant d'envisager de brancher des capteurs tiers sur un scanner ou une IRM, il faut regarder ce qui existe\n    déjà côté fabricant. Un article professionnel sur les contrats de service en imagerie\n    (<a href=\"https://radiologybusiness.com/topics/healthcare-management/healthcare-economics/ct-service-contracts-under-knife\" target=\"_blank\" rel=\"noopener\">Radiology Business, « CT Service Contracts: Under the Knife? »</a>)\n    donne des chiffres utiles pour situer le sujet, même s'il porte précisément sur les scanners (je n'ai pas\n    vérifié les mêmes pourcentages pour l'IRM) :</p>\n    <ul style=\"margin:10px 0 0 20px;font-size:13.5px;\">\n        <li style=\"margin-bottom:6px;\">Pour les scanners hospitaliers 64 coupes et plus, 84 % des contrats du fabricant (OEM) incluent déjà le diagnostic à distance, et environ deux tiers permettent une réparation à distance.</li>\n        <li style=\"margin-bottom:6px;\">L'article cite l'exemple concret d'un centre (Hackensack) où la télésurveillance du fabricant a détecté une surchauffe du tube, exactement le type d'alerte que simule ce prototype.</li>\n        <li style=\"margin-bottom:6px;\">Un contrat de service indépendant (ISO, hors fabricant) peut coûter environ 30 % de moins qu'un contrat fabricant, mais ces prestataires indépendants n'ont généralement pas accès à la télémétrie propriétaire du constructeur.</li>\n    </ul>\n    <p style=\"margin-top:10px;\">\n        Pour l'IRM, le principe est le même, et le niveau d'hélium en particulier est justement le genre de\n        paramètre que les fabricants surveillent déjà souvent à distance dans le cadre de leur contrat de\n        service, puisqu'une perte d'hélium non détectée peut mener à une perte de champ (« quench ») coûteuse à\n        réparer. Je n'ai pas trouvé de chiffre public spécifique à l'IRM pour confirmer un pourcentage comme pour\n        le scanner, donc je le présente comme une déduction logique, pas un fait vérifié.\n    </p>\n    <p style=\"margin-top:10px;\">\n        Autrement dit : pour un appareil déjà sous contrat avec son fabricant, la vraie télémétrie en temps réel\n        existe probablement déjà, via ce contrat, plutôt qu'en ajoutant des capteurs indépendants. Brancher des\n        capteurs tiers sur l'appareil pourrait par ailleurs entrer en conflit avec les clauses de garantie ou de\n        contrat de service (modification non autorisée de l'équipement). C'est un point à vérifier auprès du service\n        biomédical et du fabricant avant toute action physique sur le scanner ou l'IRM, pas seulement une question\n        de coût.\n    </p>\n</div>\n\n<div class=\"section-title\">Piste alternative : capture externe par caméra et capteurs clampés</div>\n<div class=\"card\" style=\"margin-bottom:18px;\">\n    <p>Une autre approche évite complètement de toucher à l'intérieur du scanner ou de l'IRM : installer une\n    caméra à l'extérieur de l'appareil, pointée sur un écran ou un cadran que l'appareil affiche déjà, et lire la\n    valeur par reconnaissance d'image plutôt que par un capteur électrique raccordé en interne. Comme rien n'est\n    ouvert ni modifié sur l'appareil, cette approche ne pose pas le problème de garantie ou de contrat de service\n    évoqué plus haut.</p>\n    <p style=\"margin-top:10px;\">Pour l'IRM, cette idée s'appuie sur un équipement réel déjà cité sur cette page :\n    l'instrument de niveau d'hélium AMI Model 1700 possède son propre écran tactile couleur de 4,3 pouces, monté\n    à l'extérieur du cryostat, justement pour que le technicien puisse lire le niveau sans toucher à l'aimant\n    (<a href=\"https://americanmagnetics.com/support/manuals/Model1700-Rev6.pdf\" target=\"_blank\" rel=\"noopener\">manuel American Magnetics, Model 1700</a>).\n    Une caméra pointée sur cet écran existant capturerait donc le même chiffre que celui déjà lu à l'œil par le\n    personnel, sans ajouter de capteur interne. Pour le scanner, je n'ai pas trouvé ni vérifié l'existence d'un\n    écran externe équivalent affichant la température du tube ou la position du portique : l'idée resterait à\n    confirmer auprès du service biomédical ou du fabricant.</p>\n    <p style=\"margin-top:10px;\">Ce n'est pas une idée isolée : des produits commerciaux existants font exactement\n    cela pour de l'équipement industriel, par exemple ServiceOCR Pro de Sensfix, qui lit des cadrans analogiques,\n    des afficheurs numériques et des écrans LCD avec une caméra fixe ou un smartphone, sans modification\n    matérielle de l'équipement surveillé\n    (<a href=\"https://sensfix.com/en/platform/service-ocr-pro\" target=\"_blank\" rel=\"noopener\">sensfix.com</a>).\n    Je n'ai pas trouvé d'exemple vérifié de ce produit utilisé sur de l'imagerie médicale, seulement sur de\n    l'équipement industriel et des compteurs. Sur le plan technique, ce module demanderait le même type de\n    traitement d'image que la page <a href=\"#/image\">Analyse d'image</a> de ce site, mais pour\n    reconnaître des chiffres sur un écran plutôt qu'une zone d'intérêt, ce qui resterait un développement à part\n    entière et pas une simple réutilisation du code existant.</p>\n</div>\n\n<div class=\"card\" style=\"margin-bottom:18px;\">\n    <p><strong>Idée complémentaire :</strong> un capteur clampé à l'extérieur d'un tuyau ou d'un circuit (eau,\n    liquide de refroidissement) pour détecter s'il est plein, partiellement rempli ou vide, sans percer ni ouvrir\n    le tuyau. Des produits réels existent dans cette catégorie précise de capteurs non invasifs montés à\n    l'extérieur d'un tube : le LVUN-600 d'Omega, qui se clipse sur un tube ou un tuyau à paroi épaisse de 6,4 à\n    152,4 mm de diamètre sans le percer\n    (<a href=\"https://au.omega.com/pptst/LVUN-600.html\" target=\"_blank\" rel=\"noopener\">omega.com</a>), et le\n    capteur EX-F1 de Panasonic, qui se fixe par sangle autour d'un petit tube transparent de 6 à 13 mm et détecte\n    le liquide par un faisceau infrarouge\n    (<a href=\"https://industry.panasonic.com/ap/en/products/fasys/sensor/photoelectric/number/ex-f1\" target=\"_blank\" rel=\"noopener\">panasonic.com</a>).\n    Aucun des deux ne précise son prix en ligne.</p>\n    <p style=\"margin-top:10px;\">Une précision honnête sur l'intuition de départ, qui parlait de vibrations : les\n    capteurs de niveau réellement basés sur la vibration (type \"fourche vibrante\", très courants dans\n    l'industrie) doivent normalement être en contact direct avec le liquide pour détecter le changement de\n    vibration quand ils sont mouillés, donc insérés dans le tuyau plutôt que clampés dessus de l'extérieur. Ce\n    n'est plus vraiment non invasif. Les deux produits clampés trouvés ici utilisent plutôt un signal optique à\n    travers la paroi du tube (Panasonic), ou un signal non précisé sur la page du fabricant (Omega), et d'autres\n    capteurs clampés du même genre utilisent un signal ultrasonore à travers la paroi. L'intuition d'utiliser un\n    signal physique qui traverse la paroi du tuyau depuis l'extérieur était la bonne direction ; le signal\n    réellement utilisé par les produits non invasifs trouvés ici est optique ou ultrasonore plutôt que\n    vibratoire.</p>\n</div>\n\n<p class=\"muted\" style=\"font-size:11.5px;\">\n    Je ne suis pas certaine que ces ordres de grandeur reflètent un vrai projet d'intégration hospitalière au\n    Maroc : les prix relevés viennent de distributeurs généralistes en ligne, pas d'un fournisseur biomédical\n    local, et peuvent ne plus être à jour. À présenter en soutenance comme une estimation de départ à affiner,\n    pas comme un budget validé.\n</p>";

var MON_IDS = ['1', '2'];

var STORE_KEY = 'biomed_state_v1';
var S = null;

function pad2(n) { return (n < 10 ? '0' : '') + n; }
function fmtDate(d) {
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + ' ' +
    pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
}
function fmtDay(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }

function newState() {
  return { seeded: false, readings: { '1': {}, '2': {} }, alerts: [], actions: [], di: [],
           active: { '1': true, '2': true }, statut: {}, derive: {}, nextId: 1 };
}
function saveState() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) { /* stockage indisponible : l'etat reste en memoire */ }
}
function loadState() {
  try {
    var raw = localStorage.getItem(STORE_KEY);
    if (raw) { S = JSON.parse(raw); return; }
  } catch (e) { /* ignore */ }
  S = newState();
}
function resetState() {
  S = newState();
  seedState();
  saveState();
}

function gauss() { return (Math.random() + Math.random() + Math.random()) - 1.5; }
function randInt(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
function round3(x) { return Math.round(x * 1000) / 1000; }

function niveauDe(v, def) {
  var ref = def.sens === 'absolu' ? Math.abs(v) : v;
  if (ref >= def.seuil_critique) return 'critique';
  if (ref >= def.seuil_alerte) return 'alerte';
  return 'normal';
}

function lastReading(eq, p) {
  var arr = (S.readings[eq] || {})[p] || [];
  return arr.length ? arr[arr.length - 1] : null;
}

function nextId() { return S.nextId++; }

function repairIfClosed(eq, p, def) {
  for (var i = S.alerts.length - 1; i >= 0; i--) {
    var a = S.alerts[i];
    if (a.eq == eq && a.param === p && a.statut !== 'resolue' && a.di) {
      var di = S.di.filter(function (d) { return d.id === a.di; })[0];
      if (di && di.statut === 'cloturee') {
        a.statut = 'resolue';
        return def.baseline + gauss() * def.volatilite * 0.3;
      }
      return null;
    }
  }
  return null;
}

function manageAlert(eq, p, def, valeur, niveau, t) {
  var open = null;
  for (var i = S.alerts.length - 1; i >= 0; i--) {
    var a = S.alerts[i];
    if (a.eq == eq && a.param === p && (a.statut === 'ouverte' || a.statut === 'acquittee')) { open = a; break; }
  }
  if (niveau === 'normal') { if (open) open.statut = 'resolue'; return; }

  var seuil = niveau === 'critique' ? def.seuil_critique : def.seuil_alerte;
  var message = def.label + ' : ' + valeur + ' ' + def.unite + ' (seuil ' + (niveau === 'critique' ? 'critique' : 'alerte') + ' : ' + seuil + def.unite + ')';
  var alerte;
  if (open) {
    open.niveau = niveau; open.message = message; open.t = t;
    alerte = open;
  } else {
    alerte = { id: nextId(), eq: eq, param: p, niveau: niveau, message: message, t: t, statut: 'ouverte', di: null };
    S.alerts.push(alerte);
  }
  if (niveau === 'critique' && !alerte.di) {
    var desc = 'Générée automatiquement par le monitoring continu (simulation) : ' + message +
      '. Tâche de checklist concernée : ' + def.tache_liee + '.';
    var di = { id: nextId(), eq: eq, date: t.slice(0, 10), description: desc, urgence: 'urgente', statut: 'ouverte', auto: true };
    S.di.push(di);
    alerte.di = di.id;
  }
}

function tickEquipment(eq, t) {
  var defs = MON_DEFS[eq];
  if (!defs) return false;
  if (!S.active[eq]) return false;
  var stamp = t || fmtDate(new Date());
  Object.keys(defs).forEach(function (p) {
    var def = defs[p];
    var rep = repairIfClosed(eq, p, def);
    var last, lastNiv;
    if (rep !== null) { last = rep; lastNiv = 'normal'; if (S.derive[eq] === p) S.derive[eq] = null; }
    else {
      var lr = lastReading(eq, p);
      last = lr ? lr.v : def.baseline;
      lastNiv = lr ? lr.n : 'normal';
    }
    var pas = gauss() * def.volatilite;
    var retour = (def.baseline - last) * 0.05;
    var derive = 0;
    var chance = lastNiv === 'normal' ? 15 : 45;
    if (randInt(1, 100) <= chance) {
      var sens = def.sens === 'haut' ? 1 : (randInt(0, 1) ? 1 : -1);
      var amp = lastNiv === 'normal' ? randInt(150, 350) : randInt(200, 500);
      derive = sens * def.volatilite * (amp / 100);
    }
    var forced = 0;
    if (S.derive[eq] === p) { forced = def.volatilite * 2.5; }
    var nouvelle = last + pas + retour + derive + forced;
    if (def.sens === 'haut' && nouvelle < 0) nouvelle = 0;
    nouvelle = round3(nouvelle);
    var niv = niveauDe(nouvelle, def);
    if (S.derive[eq] === p && niv === 'critique') S.derive[eq] = null;
    if (!S.readings[eq][p]) S.readings[eq][p] = [];
    S.readings[eq][p].push({ t: stamp, v: nouvelle, n: niv });
    if (S.readings[eq][p].length > 120) S.readings[eq][p].shift();
    manageAlert(eq, p, def, nouvelle, niv, stamp);
  });
  return true;
}

function seedState() {
  var now = Date.now();
  var n = 36;
  for (var i = 0; i < n; i++) {
    var stamp = fmtDate(new Date(now - (n - i) * 10 * 60000));
    MON_IDS.forEach(function (eq) { tickEquipment(eq, stamp); });
  }
  S.seeded = true;
}

function initMonitoring() {
  loadState();
  if (!S.seeded) { seedState(); saveState(); }
}

function latestLevels(eq) {
  var defs = MON_DEFS[eq] || {};
  var out = {};
  Object.keys(defs).forEach(function (p) { out[p] = lastReading(eq, p); });
  return out;
}

function monitoringBonus(eq) {
  var defs = MON_DEFS[eq];
  if (!defs) return { bonus: 0, pire: null };
  var pire = 'normal';
  var lv = latestLevels(eq);
  Object.keys(lv).forEach(function (p) {
    var n = lv[p] ? lv[p].n : 'normal';
    if (n === 'critique') pire = 'critique';
    else if (n === 'alerte' && pire !== 'critique') pire = 'alerte';
  });
  return { bonus: pire === 'critique' ? 25 : (pire === 'alerte' ? 12 : 0), pire: pire };
}

/* ---- Courbe SVG (meme trace que la version PHP) ---- */
function courbeSvg(hist, def, w, h) {
  w = w || 300; h = h || 84;
  var n = hist.length;
  if (n < 2) return '<p class="muted" style="font-size:12px;">Pas encore assez de lectures pour tracer une courbe.</p>';
  var vals = hist.map(function (l) { return l.v; });
  var sA = def.seuil_alerte, sC = def.seuil_critique, abs = def.sens === 'absolu';
  var max = Math.max.apply(null, vals.concat([sC]));
  var min = abs ? Math.min.apply(null, vals.concat([-sC, 0])) : 0;
  if (abs) { max = Math.max(max, Math.abs(min)); min = -max; }
  var marge = (max - min) * 0.12; if (marge <= 0) marge = 1;
  max += marge; if (abs) min -= marge;
  var padL = 3, padR = 3, padT = 6, padB = 6;
  var plotW = w - padL - padR, plotH = h - padT - padB, range = (max - min) || 1;
  function xDe(i) { return padL + (i / (n - 1)) * plotW; }
  function yDe(v) { return padT + plotH - ((v - min) / range) * plotH; }
  var col = { normal: 'var(--sage)', alerte: 'var(--amber)', critique: 'var(--red)' };
  var pts = [], circ = '';
  hist.forEach(function (l, i) {
    var px = Math.round(xDe(i) * 10) / 10, py = Math.round(yDe(l.v) * 10) / 10;
    pts.push(px + ',' + py);
    circ += '<circle cx="' + px + '" cy="' + py + '" r="2" fill="' + (col[l.n] || 'var(--rose-deep)') + '"><title>' + l.t + ' : ' + l.v + ' ' + def.unite + '</title></circle>';
  });
  var lignes = '';
  (abs ? [sA, -sA, sC, -sC] : [sA, sC]).forEach(function (sv) {
    if (sv < min || sv > max) return;
    var sy = Math.round(yDe(sv) * 10) / 10;
    lignes += '<line x1="' + padL + '" y1="' + sy + '" x2="' + (w - padR) + '" y2="' + sy + '" stroke="var(--ink-light)" stroke-opacity=".55" stroke-width="1" stroke-dasharray="3,3" />';
  });
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" height="' + h + '" preserveAspectRatio="none" style="display:block;">' +
    lignes + '<polyline points="' + pts.join(' ') + '" fill="none" stroke="var(--rose-deep)" stroke-width="1.5" />' + circ + '</svg>';
}

/* ---- Actions "a distance" ---- */
function monActionLog(eq, type, detail) {
  S.actions.unshift({ eq: eq, type: type, detail: detail, t: fmtDate(new Date()) });
  if (S.actions.length > 60) S.actions.pop();
}
function monPauseReprise(eq, actif) {
  S.active[eq] = actif;
  monActionLog(eq, actif ? 'reprise' : 'pause', actif ? 'Monitoring repris à distance.' : 'Monitoring mis en pause à distance.');
  saveState();
}
function monAcquitter(alerteId) {
  var a = S.alerts.filter(function (x) { return x.id === alerteId; })[0];
  if (!a) return;
  a.statut = 'acquittee';
  monActionLog(a.eq, 'acquittement', 'Alerte acquittée : ' + a.message);
  saveState();
}
function monDiagnostic(eq) {
  var defs = MON_DEFS[eq], lignes = [];
  Object.keys(defs).forEach(function (p) {
    var l = lastReading(eq, p), def = defs[p];
    if (!l) { lignes.push(def.label + ' : aucune lecture disponible.'); return; }
    var etat = l.n === 'normal' ? 'dans la plage normale' : (l.n === 'alerte' ? 'en alerte' : 'en seuil critique');
    lignes.push(def.label + ' : ' + l.v + ' ' + def.unite + ', ' + etat + '.');
  });
  var texte = 'Diagnostic à distance (simulation) du ' + fmtDate(new Date()) + ' :\n- ' + lignes.join('\n- ');
  monActionLog(eq, 'diagnostic_distance', texte);
  saveState();
  return texte;
}
function monForcerDerive(eq) {
  var defs = MON_DEFS[eq];
  var cles = Object.keys(defs);
  var p = cles[randInt(0, cles.length - 1)];
  S.derive[eq] = p;
  monActionLog(eq, 'derive_demo', 'Dérive provoquée pour la démonstration sur : ' + defs[p].label);
  saveState();
  return p;
}
function cloturerDI(id) {
  var d = S.di.filter(function (x) { return x.id === id; })[0];
  if (d) { d.statut = 'cloturee'; saveState(); }
}

/* ===================== Analyse d'image : seuillage d'Otsu ===================== */
function otsuSeuil(hist, total) {
  var sommeTotale = 0, i;
  for (i = 0; i < 256; i++) sommeTotale += i * hist[i];
  var sommeFond = 0, poidsFond = 0, meilleureVar = -1, meilleurSeuil = 127;
  for (var t = 0; t < 256; t++) {
    poidsFond += hist[t];
    if (poidsFond === 0) continue;
    var poidsPP = total - poidsFond;
    if (poidsPP === 0) break;
    sommeFond += t * hist[t];
    var mF = sommeFond / poidsFond;
    var mP = (sommeTotale - sommeFond) / poidsPP;
    var v = poidsFond * poidsPP * Math.pow(mF - mP, 2);
    if (v > meilleureVar) { meilleureVar = v; meilleurSeuil = t; }
  }
  return meilleurSeuil;
}

function plusGrandeComposante(masque, w, h) {
  var total = w * h;
  var visite = new Uint8Array(total);
  var minT = Math.max(20, Math.floor(total * 0.005));
  var maxT = Math.floor(total * 0.70);
  var meilleure = null, meilleureT = 0;
  var pile = new Int32Array(total);
  for (var y = 0; y < h; y++) {
    for (var x = 0; x < w; x++) {
      var idx = y * w + x;
      if (masque[idx] !== 1 || visite[idx]) continue;
      var sp = 0; pile[sp++] = idx; visite[idx] = 1;
      var minX = x, maxX = x, minY = y, maxY = y, taille = 0;
      while (sp > 0) {
        var c = pile[--sp];
        var cx = c % w, cy = (c - cx) / w;
        taille++;
        if (cx < minX) minX = cx; if (cx > maxX) maxX = cx;
        if (cy < minY) minY = cy; if (cy > maxY) maxY = cy;
        if (cx + 1 < w) { var n1 = c + 1; if (masque[n1] === 1 && !visite[n1]) { visite[n1] = 1; pile[sp++] = n1; } }
        if (cx > 0) { var n2 = c - 1; if (masque[n2] === 1 && !visite[n2]) { visite[n2] = 1; pile[sp++] = n2; } }
        if (cy + 1 < h) { var n3 = c + w; if (masque[n3] === 1 && !visite[n3]) { visite[n3] = 1; pile[sp++] = n3; } }
        if (cy > 0) { var n4 = c - w; if (masque[n4] === 1 && !visite[n4]) { visite[n4] = 1; pile[sp++] = n4; } }
      }
      if (taille >= minT && taille <= maxT && taille > meilleureT) {
        meilleureT = taille;
        meilleure = { x: minX, y: minY, w: maxX - minX + 1, h: maxY - minY + 1, taille: taille };
      }
    }
  }
  return meilleure;
}

function analyserImage(source, W, H) {
  var maxL = 300;
  var echelle = W > maxL ? maxL / W : 1;
  var w = Math.max(1, Math.round(W * echelle));
  var h = Math.max(1, Math.round(H * echelle));
  var c = document.createElement('canvas'); c.width = w; c.height = h;
  var ctx = c.getContext('2d');
  ctx.drawImage(source, 0, 0, w, h);
  var d = ctx.getImageData(0, 0, w, h).data;
  var gris = new Int32Array(w * h), hist = new Array(256).fill(0);
  for (var i = 0; i < w * h; i++) {
    var l = Math.round(0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2]);
    gris[i] = l; hist[l]++;
  }
  var seuil = otsuSeuil(hist, w * h);
  var nbAu = 0;
  for (i = 0; i < w * h; i++) if (gris[i] >= seuil) nbAu++;
  var ppAuDessus = nbAu < (w * h - nbAu);
  var masque = new Uint8Array(w * h);
  for (i = 0; i < w * h; i++) masque[i] = ((gris[i] >= seuil) === ppAuDessus) ? 1 : 0;
  var comp = plusGrandeComposante(masque, w, h);
  if (!comp) return { detectee: false, seuil: seuil, w: w, h: h };
  var sZ = 0, nZ = 0, sF = 0, nF = 0;
  for (var y = 0; y < h; y++) {
    for (var x = 0; x < w; x++) {
      var k = y * w + x;
      var dedans = x >= comp.x && x < comp.x + comp.w && y >= comp.y && y < comp.y + comp.h && masque[k] === 1;
      if (dedans) { sZ += gris[k]; nZ++; } else { sF += gris[k]; nF++; }
    }
  }
  var iZ = nZ ? sZ / nZ : 0, iF = nF ? sF / nF : 0;
  return {
    detectee: true, seuil: seuil, w: w, h: h,
    bbox: { x: Math.round(comp.x / echelle), y: Math.round(comp.y / echelle), w: Math.round(comp.w / echelle), h: Math.round(comp.h / echelle) },
    aire: Math.round(comp.taille / (w * h) * 1000) / 10,
    iZ: Math.round(iZ * 10) / 10, iF: Math.round(iF * 10) / 10,
    contraste: Math.round(Math.abs(iZ - iF) * 10) / 10
  };
}

function rngSeed(seed) { var s = seed; return function () { s = (s * 1664525 + 1013904223) % 4294967296; return s / 4294967296; }; }

function initImagePage() {
  var cv = document.getElementById('img-canvas');
  var cctx = cv.getContext('2d');
  var resBox = document.getElementById('img-result');

  function traiter(source, W, H) {
    cv.width = W; cv.height = H;
    cctx.drawImage(source, 0, 0, W, H);
    var r = analyserImage(source, W, H);
    if (r.detectee) {
      cctx.strokeStyle = '#e0306e';
      cctx.lineWidth = Math.max(3, Math.round(W / 120));
      cctx.strokeRect(r.bbox.x, r.bbox.y, r.bbox.w, r.bbox.h);

/* ===================== Prédiction : régression logistique ===================== */
var MODELE = {
  noms: ["Température de l'air", 'Température du process', 'Vitesse de rotation', 'Couple', "Usure de l'outil", 'Type L', 'Type M'],
  coef: [1.963943, -1.403247, 1.804496, 2.522511, 0.918044, 0.77798, 0.328194],
  intercept: -2.169653879380682,
  moyenne: [300.00545, 310.006062, 1539.356875, 40.003362, 107.685],
  echelle: [1.996719, 1.479339, 180.971631, 10.018919, 63.608026]
};

function predire(v, type) {
  var contrib = [], z = MODELE.intercept;
  for (var i = 0; i < 5; i++) {
    var s = (v[i] - MODELE.moyenne[i]) / MODELE.echelle[i];
    var c = MODELE.coef[i] * s;
    contrib.push(c); z += c;
  }
  var cL = type === 'L' ? MODELE.coef[5] : 0;
  var cM = type === 'M' ? MODELE.coef[6] : 0;
  contrib.push(cL, cM); z += cL + cM;
  return { p: 1 / (1 + Math.exp(-z)), contrib: contrib };
}

function initPredPage() {
  var ids = ['p-air', 'p-proc', 'p-rpm', 'p-torque', 'p-wear'];
  function maj() {
    var v = ids.map(function (id) { return parseFloat(document.getElementById(id).value); });
    if (v.some(function (x) { return isNaN(x); })) return;
    var r = predire(v, document.getElementById('p-type').value);
    var pct = Math.round(r.p * 1000) / 10;
    document.getElementById('p-score').textContent = pct + ' %';
    var g = document.getElementById('p-gauge');
    g.style.width = pct + '%';
    var niveau, couleur;
    if (r.p >= 0.5) { niveau = 'Risque élevé : le modèle déclenche une alerte (seuil 50 %).'; couleur = 'var(--red)'; }
    else if (r.p >= 0.25) { niveau = 'Risque moyen : à surveiller.'; couleur = 'var(--amber)'; }
    else { niveau = 'Risque faible.'; couleur = 'var(--sage)'; }
    g.style.background = couleur;
    document.getElementById('p-level').textContent = niveau;
    var maxAbs = Math.max.apply(null, r.contrib.map(Math.abs).concat([0.5]));
    var html = '';
    for (var i = 0; i < r.contrib.length; i++) {
      var c = r.contrib[i], w = Math.abs(c) / maxAbs * 50;
      var left = c >= 0 ? 50 : 50 - w;
      html += '<div style="display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13px">' +
        '<div style="width:150px">' + MODELE.noms[i] + '</div>' +
        '<div style="flex:1;position:relative;height:10px;background:var(--rose-pale);border-radius:99px;overflow:hidden">' +
        '<span style="position:absolute;top:0;bottom:0;left:' + left + '%;width:' + w + '%;background:' + (c >= 0 ? 'var(--rose-deep)' : 'var(--sage)') + '"></span>' +
        '<i style="position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--ink-light)"></i></div>' +
        '<div class="mono" style="width:46px;text-align:right">' + (c >= 0 ? '+' : '') + c.toFixed(2) + '</div></div>';
    }
    document.getElementById('p-contrib').innerHTML = html;
  }
  ids.concat(['p-type']).forEach(function (id) { document.getElementById(id).addEventListener('input', maj); });
  function preset(vals, type) {
    ids.forEach(function (id, i) { document.getElementById(id).value = vals[i]; });
    document.getElementById('p-type').value = type;
    maj();
  }
  document.getElementById('p-normal').addEventListener('click', function () { preset([300, 310, 1500, 40, 50], 'M'); });
  document.getElementById('p-charge').addEventListener('click', function () { preset([302.5, 311, 1400, 55, 200], 'L'); });
  maj();
}

function riskScore(eq) {
  var iv = D.interventions.filter(function (i) { return i.equipement_id === eq.id; });
  var nbCorr = iv.filter(function (i) { return i.type === 'corrective'; }).length;
  var derniere = null;
  iv.forEach(function (i) { if (!derniere || i.date_intervention > derniere) derniere = i.date_intervention; });
  var jours = derniere ? Math.floor((Date.now() - new Date(derniere).getTime()) / 86400000) : 365;
  var score = Math.min(40, nbCorr * 10) + Math.min(30, Math.floor(jours / 10));
  var st = statutDe(eq);
  score += st === 'en_panne' ? 30 : (st === 'en_maintenance' ? 15 : 0);
  score += monitoringBonus(String(eq.id)).bonus;
  return Math.min(100, score);
}
function riskLevel(sc) {
  if (sc >= 66) return { label: 'Risque élevé', cls: 'risk-high' };
  if (sc >= 33) return { label: 'Risque moyen', cls: 'risk-medium' };
  return { label: 'Risque faible', cls: 'risk-low' };
}

      h += '<tr><td><strong>' + esc(e.nom) + '</strong>' + (isMonitored(e.id) ? ' <span class="badge badge-rose">Monitoring continu</span>' : '') + '</td><td class="mono">' + (ts.length || '-') + '</td><td class="mono">' + ts.filter(function (t) { return t.est_qualification; }).length + '</td><td class="muted" style="font-size:12px;max-width:280px;">' + esc(cl ? cl.source_reference : 'Checklist générique par défaut') + '</td><td><a class="btn btn-outline btn-sm" href="#/equipement/' + e.id + '/' + (isMonitored(e.id) ? 'monitoring' : 'checklist') + '">Ouvrir</a></td></tr>';
    });
    h += '</tbody></table></div>';
  });
  return wrap('Checklists de maintenance préventive', 'Une checklist propre à chaque équipement', h);
}
function pageDemandes() {
  var di = S.di.slice().sort(function (a, b) { return b.id - a.id; });
  var h = '<div class="table-wrap" style="margin-bottom:24px;"><table><thead><tr><th>N°</th><th>Date</th><th>Équipement</th><th>Origine</th><th>Urgence</th><th>Description</th><th>Statut</th><th></th></tr></thead><tbody>' +
    (di.length ? di.map(function (d) {
      return '<tr><td class="mono">#' + d.id + '</td><td class="mono">' + esc(d.date) + '</td><td>' + esc(EQ[d.eq].nom) + '</td><td>' + (d.auto ? '<span class="badge badge-rose">Monitoring</span>' : 'Manuelle') + '</td><td><span class="badge ' + (d.urgence === 'urgente' ? 'badge-panne' : 'badge-rose') + '">' + (d.urgence === 'urgente' ? 'Urgente' : 'Normale') + '</span></td><td style="max-width:360px;font-size:12.5px;">' + esc(d.description) + '</td><td><span class="badge ' + (d.statut === 'cloturee' ? 'badge-service' : 'badge-maint') + '">' + (d.statut === 'cloturee' ? 'Clôturée' : 'Ouverte') + '</span></td><td>' + (d.statut !== 'cloturee' ? '<button class="btn btn-outline btn-sm" type="button" onclick="cloturer(' + d.id + ')">Clôturer</button>' : '') + '</td></tr>';
    }).join('') : '<tr><td colspan="8" class="muted" style="text-align:center;padding:24px;">Aucune demande pour l\'instant.</td></tr>') + '</tbody></table></div>' +
    '<div class="card" style="border-left:4px solid var(--rose-deep);margin-bottom:20px;"><strong>Boucle de réparation.</strong> Quand une demande créée automatiquement par le monitoring est clôturée ici, le paramètre concerné revient à sa valeur normale à la lecture suivante et l\'alerte passe à « résolue ». C\'est ce qui relie une action humaine à la simulation.</div>' +
    '<div class="section-title">Nouvelle demande d\'intervention</div><div class="card"><div class="grid grid-3"><div class="field"><label>Équipement</label><select id="di-eq">' +
    D.equipements.slice().sort(function (a, b) { return a.nom.localeCompare(b.nom); }).map(function (e) { return '<option value="' + e.id + '">' + esc(e.nom) + '</option>'; }).join('') +
    '</select></div><div class="field"><label>Urgence</label><select id="di-urg"><option value="normale">Normale</option><option value="urgente">Urgente</option></select></div></div>' +
    '<div class="field"><label>Description du problème</label><textarea id="di-desc" rows="2"></textarea></div><button class="btn btn-primary" type="button" id="di-btn">Envoyer la demande</button></div>';

}
function cloturer(id) { cloturerDI(id); route(); }
function initDemandes() {
  document.getElementById('di-btn').addEventListener('click', function () {
    var desc = document.getElementById('di-desc').value.trim();
    if (!desc) { document.getElementById('di-desc').focus(); return; }
    S.di.push({ id: nextId(), eq: document.getElementById('di-eq').value, date: fmtDay(new Date()), description: desc, urgence: document.getElementById('di-urg').value, statut: 'ouverte', auto: false });

}

/* ====================== PRÉDICTION ====================== */
function pagePrediction() {
  var scored = D.equipements.map(function (e) { var sc = riskScore(e); return { e: e, sc: sc, rk: riskLevel(sc) }; }).sort(function (a, b) { return b.sc - a.sc; });
  var h = '<div class="card" style="border-left:4px solid var(--rose-deep);margin-bottom:20px;"><strong>Deux volets.</strong> (1) Un score de risque par équipement, calculé par une formule transparente à partir de l\'historique et du monitoring. (2) Un modèle entraîné sur de vraies pannes industrielles, utilisable en direct plus bas. Le premier n\'est pas un modèle appris, le second n\'est pas entraîné sur des équipements biomédicaux : les deux limites sont indiquées.</div>';
  h += '<div class="section-title" style="margin-top:0;">1. Score de risque par équipement (formule transparente)</div>' +
    '<div class="card" style="margin-bottom:16px;font-size:13.5px;">Fréquence des pannes correctives (jusqu\'à 40 points), temps écoulé depuis la dernière intervention (jusqu\'à 30 points), statut actuel (jusqu\'à 30 points), et pour le scanner et l\'IRM un terme supplémentaire (jusqu\'à 25 points) qui reflète l\'état le plus défavorable des lectures en direct. Ouvrez le monitoring et provoquez une dérive : le score de ces équipements change.</div>' +
    '<div class="table-wrap"><table><thead><tr><th>Équipement</th><th>Service</th><th>Statut</th><th>Score de risque</th><th></th></tr></thead><tbody>' +
    scored.slice(0, 20).map(function (s) {
      return '<tr><td><strong>' + esc(s.e.nom) + '</strong></td><td><span class="badge badge-service">' + esc(nomsSvc(s.e.service_id)) + '</span></td><td>' + esc(STATUT_LABEL[statutDe(s.e)]) + '</td><td><div style="display:flex;align-items:center;gap:10px;"><div class="risk-bar"><span style="width:' + s.sc + '%;"></span></div><span class="' + s.rk.cls + '">' + s.sc + ', ' + s.rk.label + '</span></div></td><td><a class="btn btn-outline btn-sm" href="#/equipement/' + s.e.id + '">Voir la fiche</a></td></tr>';
    }).join('') + '</tbody></table></div><p class="muted" style="font-size:12px;margin-top:8px;">20 équipements les plus à risque affichés sur ' + scored.length + '.</p>';

  h += '<div class="section-title">2. Modèle de prédiction de pannes (régression logistique)</div>' +
    '<div class="card" style="border-left:4px solid var(--amber);margin-bottom:16px;">Il n\'existe pas de jeu de données public de pannes d\'équipements biomédicaux. Le modèle est entraîné sur un jeu public de référence en maintenance industrielle (AI4I 2020, 10 000 relevés d\'une fraiseuse, licence CC BY 4.0). Il prouve que la chaîne complète (entraînement, évaluation, utilisation) fonctionne sur de vraies pannes. Il ne prédit pas les pannes d\'un scanner ou d\'une IRM.</div>' +
    '<div class="grid grid-2"><div class="card"><h3>Relevé de la machine</h3><div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;"><button class="btn btn-outline btn-sm" type="button" id="p-normal">Régime normal</button><button class="btn btn-outline btn-sm" type="button" id="p-charge">Machine surchargée</button></div>' +
    '<div class="field"><label>Température de l\'air (K)</label><input type="number" id="p-air" step="0.1" value="300"></div>' +
    '<div class="field"><label>Température du process (K)</label><input type="number" id="p-proc" step="0.1" value="310"></div>' +
    '<div class="field"><label>Vitesse de rotation (tr/min)</label><input type="number" id="p-rpm" step="10" value="1500"></div>' +
    '<div class="field"><label>Couple (Nm)</label><input type="number" id="p-torque" step="0.5" value="40"></div>' +
    '<div class="field"><label>Usure de l\'outil (min)</label><input type="number" id="p-wear" step="5" value="50"></div>' +
    '<div class="field"><label>Type de produit (qualité)</label><select id="p-type"><option value="L">L (basse)</option><option value="M" selected>M (moyenne)</option><option value="H">H (haute)</option></select></div></div>' +
    '<div class="card"><h3>Score de risque</h3><div class="display" style="font-size:34px;color:var(--rose-deep);" id="p-score">0 %</div>' +
    '<div style="height:16px;background:var(--rose-pale);border-radius:99px;overflow:hidden;margin:8px 0;"><span id="p-gauge" style="display:block;height:100%;width:0;background:var(--sage);transition:width .25s;"></span></div>' +
    '<p id="p-level" style="font-weight:600;margin-bottom:10px;"></p><h3 style="margin-top:12px;font-size:15px;">Ce qui pèse dans le score</h3><div id="p-contrib"></div>' +
    '<p class="muted" style="font-size:12px;margin-top:10px;">Barre vers la droite : augmente le risque. Vers la gauche : le diminue.</p></div></div>' +
    '<div class="card" style="margin-top:16px;"><h3>Performance mesurée sur 2 000 relevés jamais vus à l\'entraînement</h3><div class="table-wrap" style="box-shadow:none;margin-top:8px;"><table><thead><tr><th></th><th>Régression logistique (utilisée ici)</th><th>Forêt aléatoire (non exportée)</th></tr></thead><tbody>' +
    '<tr><td>ROC-AUC</td><td>90,8 %</td><td>96,9 %</td></tr><tr><td>Rappel (pannes détectées)</td><td>82,4 %</td><td>79,4 %</td></tr><tr><td>Précision</td><td>14,5 %</td><td>40,0 %</td></tr></tbody></table></div>' +
    '<p style="font-size:13.5px;margin-top:10px;">Au seuil de 50 %, la régression logistique détecte 56 des 68 pannes du jeu de test, au prix de 330 fausses alertes. Les pannes ne représentent que 3,4 % des données et l\'entraînement a rééquilibré les classes pour ne pas rater de pannes. Je pense donc que le score affiché est plus élevé que la vraie fréquence de panne : il faut le lire comme un niveau de risque relatif, pas comme une probabilité exacte.</p></div>';
  return wrap('Prédiction', 'Score de risque et modèle entraîné sur de vraies pannes', h);
}

/* ====================== ANALYSE D'IMAGE ====================== */
function pageImage() {
  var h = '<div class="card" style="border-left:4px solid var(--amber);margin-bottom:20px;"><strong>Ce que fait réellement ce module.</strong> L\'image est convertie en niveaux de gris, un seuil de séparation optimal est calculé par la méthode d\'Otsu (1979) à partir de l\'histogramme réel de l\'image, puis la plus grande région connexe qui se détache du fond est repérée. C\'est un algorithme classique, déterministe et vérifiable, pas un modèle entraîné et pas un système de diagnostic. Il repère « la zone la plus contrastée par rapport au fond », qui peut être une lésion, un artefact ou un reflet. L\'image reste dans votre navigateur. Pour tester avec de vraies images médicales anonymisées : <a href="https://www.cancerimagingarchive.net" target="_blank" rel="noopener">The Cancer Imaging Archive</a>.</div>' +
    '<div class="grid grid-2"><div class="card"><div class="section-title" style="margin-top:0;">Charger une image</div><div class="field"><input type="file" id="img-file" accept="image/png,image/jpeg"></div>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;"><button class="btn btn-outline btn-sm" type="button" id="ex1">Exemple : zone nette</button><button class="btn btn-outline btn-sm" type="button" id="ex2">Exemple : image uniforme</button></div>' +
    '<canvas id="img-canvas" width="400" height="300" style="max-width:100%;border-radius:8px;border:1px solid var(--border);background:#000;"></canvas></div>' +
    '<div class="card"><div class="section-title" style="margin-top:0;">Résultat</div><div id="img-result" class="muted">Choisissez une image pour lancer le calcul.</div></div></div>' +
    '<div class="section-title">Pour aller plus loin</div><div class="card"><p>Limite connue : un dégradé d\'éclairage lent et fort sur toute l\'image peut fausser la détection, car le seuil est global. Une vraie version clinique s\'appuierait sur un modèle de segmentation entraîné sur un jeu d\'images médicales anonymisées, validé par un radiologue avant tout usage clinique, dans le respect de la loi 09-08 sur les données personnelles.</p></div>';
  return wrap('Analyse d\'image', 'Seuillage d\'Otsu et composantes connexes, pas un diagnostic', h);
}

/* ====================== COÛT, SUITE, CONTRAINTES ====================== */
function pageCout() { return wrap('Coût d\'un projet de capteurs réels', 'Monitoring continu : du prototype simulé à un vrai déploiement', COUT_HTML); }

function pageSuite() {
  var h = '<p class="muted" style="margin-bottom:18px;max-width:760px;">Les prochaines étapes, par ordre de priorité.</p><div class="grid grid-2">' +
    card('Réentraîner sur de vraies données biomédicales', 'Garder la même chaîne d\'entraînement, mais l\'alimenter avec l\'historique de pannes d\'un vrai parc d\'équipements dès qu\'il existe.') +
    card('Remplacer les valeurs simulées par de vraies lectures', 'La logique d\'alerte, de demande d\'intervention et de score de risque n\'aurait pas besoin de changer. Seule la source des valeurs change.') +
    card('Tester la lecture d\'écran par caméra', 'Sur l\'IRM, un instrument de niveau d\'hélium (AMI Model 1700) possède déjà un écran externe, monté hors du cryostat. Une caméra et une reconnaissance de chiffres pourraient lire ce niveau sans modifier l\'aimant. Pour le scanner, aucun écran équivalent confirmé. Précédent industriel : <a href="https://sensfix.com/en/platform/service-ocr-pro" target="_blank" rel="noopener">ServiceOCR Pro (Sensfix)</a>, non vérifié pour l\'imagerie médicale.') +
    card('Détecter un niveau de liquide depuis l\'extérieur d\'un tuyau', 'Des capteurs clipsés existent : <a href="https://au.omega.com/pptst/LVUN-600.html" target="_blank" rel="noopener">Omega LVUN-600</a> et <a href="https://industry.panasonic.com/ap/en/products/fasys/sensor/photoelectric/number/ex-f1" target="_blank" rel="noopener">Panasonic EX-F1</a>. Ils utilisent un signal optique ou ultrasonore, pas la vibration : les capteurs vibrants (fourche vibrante) doivent toucher le liquide.') +
    card('Étendre le monitoring à d\'autres équipements', 'L\'architecture est générique : le scanner et l\'IRM sont couverts avec le même code. Il suffit d\'ajouter les paramètres d\'un nouvel équipement (mammographe, module CT de la gamma-caméra).') +
    card('Améliorer l\'analyse d\'image', 'Corriger la sensibilité aux dégradés d\'éclairage, puis tester un modèle de segmentation entraîné sur des images médicales publiques et anonymisées.') +
    card('Retrouver une vraie base de données', 'Cette copie statique garde son état dans le navigateur. La version locale PHP et MySQL a une vraie base. Un hébergement avec base de données permettrait de partager l\'état entre visiteurs.') + '</div>';
  return wrap('Suite du projet', 'Ce que je veux faire ensuite', h);
}
function card(t, p) { return '<div class="card"><h3 style="font-size:16px;margin-bottom:6px;">' + esc(t) + '</h3><p>' + p + '</p></div>'; }

function pageContraintes() {
  var items = [
    ['1. État des lieux et fiches équipements', '52 appareils, 9 services. Les données techniques viennent d\'un rapport de stage d\'observation, donc de ce qui a été observé ou communiqué pendant cette période, pas d\'un inventaire mis à jour en continu. Les noms du personnel sont fictifs. Aucune photo réelle des équipements n\'est intégrée.'],
    ['2. Checklists et qualification', '52 checklists (une par équipement, plus une générique), 269 tâches. Construites à partir des pratiques de maintenance préventive décrites dans le rapport et des principes généraux de maintenance, pas validées une à une par un responsable qualité biomédical. Certaines tâches s\'appuient sur une panne ou une observation réelle du stage (indiqué dans la source), d\'autres sont des tâches standard pour ce type d\'équipement.'],
    ['3. Historique de maintenance', '16 interventions réellement décrites dans le rapport. C\'est un échantillon limité à la période et aux cas couverts par le stage, pas un historique complet.'],
    ['4. Accès par rôle', 'La version locale reproduit la hiérarchie d\'un vrai logiciel de GMAO (demandeur, technicien, responsable) en version simplifiée. Cette copie en ligne n\'a ni connexion ni rôles : tout est accessible à tous.'],
    ['5. Analyse d\'image (seuillage d\'Otsu)', 'Algorithme de traitement d\'image classique, réel sur les pixels envoyés, mais pas un outil de diagnostic : pas de modèle entraîné, pas de validation clinique, pas de donnée patient. Il repère la zone la plus contrastée, pas une structure anatomique, et reste sensible aux forts dégradés d\'éclairage.'],
    ['6. Prédiction', 'Le score de risque par équipement est une formule écrite à la main, pas un modèle appris, et ses poids ne sont pas validés par un statisticien. Le modèle entraîné (régression logistique) utilise des données industrielles publiques, pas biomédicales, et son score est à lire comme un niveau relatif.'],
    ['7. Monitoring continu (scanner et IRM)', 'Les valeurs sont générées par un moteur de simulation dans le navigateur : aucun appareil réel n\'est instrumenté. La majorité des seuils sont de vraies tolérances publiées (AAPM, ACR). Un vrai système demanderait des capteurs ou une lecture d\'écran par caméra, et un serveur pour recevoir les données.'],
    ['8. Coût des capteurs réels', 'Les prix cités viennent de recherches ponctuelles sur des distributeurs généralistes, pas de devis biomédicaux ni de catalogues de fabricants. Plusieurs postes sont marqués « non trouvé » plutôt que remplacés par un chiffre inventé.'],
    ['9. Contraintes techniques', 'Cette copie est un site statique : pas de base de données ni de serveur. L\'état de la démonstration (lectures, alertes, demandes) est gardé dans le navigateur de chaque visiteur et peut être réinitialisé. Aucune donnée personnelle ou médicale réelle n\'est stockée.']
  ];
  var h = '<div class="card" style="border-left:4px solid var(--amber);margin-bottom:20px;">Cette page liste honnêtement les limites de chaque partie du site. Elles tiennent à deux causes : un stage d\'observation ne donne pas accès aux systèmes internes des fabricants ni à de vraies données patient, et ce site est un projet étudiant, pas un développement validé par un déploiement hospitalier.</div><div class="grid grid-2">' +
    items.map(function (i) { return '<div class="card"><div class="section-title" style="margin-top:0;">' + esc(i[0]) + '</div><p>' + esc(i[1]) + '</p></div>'; }).join('') + '</div>';
  return wrap('Contraintes du projet', 'Les limites de chaque module, présentées telles quelles', h);
}

/* Routeur et navigation. Aucune connexion : tout est accessible. */
var NAV = [
  ['#/', 'Accueil', '★', 'accueil'],
  ['#/dashboard', 'Tableau de bord', '◆', 'dashboard'],
  ['#/equipements', 'Équipements', '▤', 'equipements'],
  ['#/interventions', 'Historique', '↻', 'interventions'],
  ['#/checklists', 'Checklists / Qualification', '☑', 'checklists'],
  ['#/demandes', 'Demandes d\'intervention', '✉', 'demandes'],
  ['#/monitoring/2', 'Monitoring continu', '◉', 'monitoring'],
  ['#/alertes', 'Historique des alertes', '⏱', 'alertes'],
  ['#/cout', 'Coût capteurs réels', '¤', 'cout'],
  ['#/image', 'Analyse d\'image', '◐', 'image'],
  ['#/prediction', 'Prédiction', '✦', 'prediction'],
  ['#/suite', 'Suite du projet', '➜', 'suite'],
  ['#/contraintes', 'Contraintes', '⚠', 'contraintes']
];

function navHtml(cur) {
  return NAV.map(function (n) {
    var actif = n[3] === cur || (cur === 'equipement' && n[3] === 'equipements');
    return '<a class="' + (actif ? 'active' : '') + '" href="' + n[0] + '">' + n[2] + ' ' + n[1] + '</a>';
  }).join('');
}

var CURRENT = null;
function go(h) {
  CURRENT = h;
  try { history.replaceState(null, '', h); } catch (e) { /* aperçu sans historique : on garde la page en mémoire */ }
  route();
}

function route() {
  stopMonTimer();
  var hash = (CURRENT || location.hash || '#/').replace(/^#\/?/, '');
  var parts = hash.split('/');
  var page = parts[0] || 'accueil';
  var html = '', after = null, cur = page;
  switch (page) {
    case 'accueil': html = pageAccueil(); break;
    case 'dashboard': html = pageDashboard(); break;
    case 'equipements': html = pageEquipements(); after = initEquipements; break;
    case 'equipement':
      var id = parseInt(parts[1], 10), tab = parts[2] || 'fiche';
      html = pageEquipement(id, tab); after = function () { initEquipement(id, tab); }; break;
    case 'interventions': html = pageInterventions(); break;
    case 'checklists': html = pageChecklists(); break;
    case 'demandes': html = pageDemandes(); after = initDemandes; break;
    case 'monitoring':
      var m = MON_IDS.indexOf(parts[1]) >= 0 ? parts[1] : '2';
      html = pageMonitoring(m); after = function () { startMonTimer(m); }; break;
    case 'alertes': html = pageAlertes(); after = initAlertes; break;
    case 'cout': html = pageCout(); break;
    case 'image': html = pageImage(); after = initImagePage; break;
    case 'prediction': html = pagePrediction(); after = initPredPage; break;
    case 'suite': html = pageSuite(); break;
    case 'contraintes': html = pageContraintes(); break;
    default: html = wrap('Page introuvable', '', '<p>Cette page n\'existe pas. <a href="#/">Retour à l\'accueil</a>.</p>'); cur = '';
  }
  document.getElementById('nav').innerHTML = navHtml(cur);
  document.getElementById('view').innerHTML = html;
  window.scrollTo(0, 0);
  if (after) after();
}

window.addEventListener('hashchange', function () { CURRENT = null; route(); });
document.addEventListener('click', function (e) {
  var a = e.target.closest ? e.target.closest('a[href^="#/"]') : null;
  if (!a) return;
  e.preventDefault();
  go(a.getAttribute('href'));
});
document.addEventListener('DOMContentLoaded', function () { initMonitoring(); route(); });


</script>
